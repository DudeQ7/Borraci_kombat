name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Runner ma ~14 GB wolnego miejsca. Obraz unityci/editor waży kilkanaście GB,
      # bez tego docker pull padal na 'no space left on device' (exit 125).
      - name: Free disk space
        run: |
          sudo swapoff -a
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift /opt/hostedtoolcache/CodeQL
          sudo rm -f /swapfile || true
          sudo docker image prune --all --force || true
          sudo apt-get clean
          df -h /

      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-Win64-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-Win64-

      - uses: game-ci/unity-builder@v4
        id: build
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: StandaloneWindows64
          buildsPath: Builds
          versioning: Semantic

      - uses: actions/upload-artifact@v4
        with:
          name: Boracci_kombat-v${{ steps.build.outputs.buildVersion }}-Win64
          path: Builds/StandaloneWindows64

      - name: Zip
        if: github.ref == 'refs/heads/main'
        run: cd Builds/StandaloneWindows64 && zip -r ../../Boracci_kombat-v${{ steps.build.outputs.buildVersion }}-win64.zip .

      - uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v${{ steps.build.outputs.buildVersion }}
          name: Boracci_kombat v${{ steps.build.outputs.buildVersion }}
          prerelease: false
          make_latest: true
          generate_release_notes: true
          files: Boracci_kombat-*-win64.zip