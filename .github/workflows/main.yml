name: Build project

env:
  PROJECT_NAME: Borraci_kombat

on:
  push:
    branches: [main]
  workflow_dispatch:

# Nowy push anuluje trwający build — mniej minut i brak wyścigu o ten sam tag
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build for ${{ matrix.targetPlatform }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        targetPlatform:
          - StandaloneWindows64
        include:
          - targetPlatform: StandaloneWindows64
            shortName: win64
    steps:
      # Runner ma 14 GB SSD — build Unity tego nie mieści. Zwalniamy ~20 GB.
      - name: Free disk space
        run: |
          sudo swapoff -a
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift /opt/hostedtoolcache/CodeQL
          sudo rm -f /swapfile || true
          sudo docker image prune --all --force || true
          sudo apt-get clean
          df -h /

      # LFS: true, jeśli .gitattributes ma filtry LFS (duże assety)
      # fetch-depth: 0 potrzebne do versioning: Semantic
      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      # Cache Library/ — bez tego buildy trwają wieki
      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-

      # unity-builder czyta wersję Unity z ProjectSettings/ProjectVersion.txt
      - uses: game-ci/unity-builder@v4
        id: build
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: ${{ matrix.targetPlatform }}
          buildsPath: Builds
          versioning: Semantic

      # Nazwa builda z wersją: TwojaGra-v0.1.3-win64
      - name: Name build with version
        run: mv "Builds/${{ matrix.targetPlatform }}" "Builds/${{ env.PROJECT_NAME }}-v${{ steps.build.outputs.buildVersion }}-${{ matrix.shortName }}"

      # Release, tag v0.MINOR.PATCH — nie-pre-release, więc widać w sidebarze Releases
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.build.outputs.buildVersion }}
          name: ${{ env.PROJECT_NAME }} v${{ steps.build.outputs.buildVersion }}
          files: Builds/**
          prerelease: false
          make_latest: true
